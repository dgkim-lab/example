services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: googleauthenticator
      POSTGRES_PASSWORD: googleauthenticator
      POSTGRES_DB: googleauthenticator_demo
    ports:
      - "5433:5432"
    volumes:
      - googleauthenticator_postgres_data:/var/lib/postgresql/data

volumes:
  googleauthenticator_postgres_data:
