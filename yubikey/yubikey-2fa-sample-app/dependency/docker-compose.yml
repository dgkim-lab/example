services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yubikey
      POSTGRES_PASSWORD: yubikey
      POSTGRES_DB: yubikey_demo
    ports:
      - "5433:5432"
    volumes:
      - yubikey_postgres_data:/var/lib/postgresql/data

volumes:
  yubikey_postgres_data:
